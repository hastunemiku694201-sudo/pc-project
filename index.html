<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RigForge: build your custom PC with live compatibility checks, price history, a 3D preview and prices in 15 currencies.">
<title>RigForge PC Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Unbounded:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap">
<style>
/* Layout: forge workbench — glass header (views + currency + AI), card grid of parts, floating build console; 3D stage, picks page, detail drawer, chat panel. Dark-first, ember accent. */
:root{
  --bg:#0A0C0F; --surface:#12161C; --surface-2:#1A2029; --surface-3:#222A35; --ink:#ECEFF3; --muted:#8B95A3; --line:#252C36;
  --accent:#FF6B2C; --accent-2:#FFB547; --accent-ink:#160A03; --glow:rgba(255,107,44,.16); --head:rgba(10,12,15,.74); --scrim:rgba(0,0,0,.55);
  --ok:#3DD68C; --ok-soft:rgba(61,214,140,.12); --warn:#F5B544; --warn-soft:rgba(245,181,68,.13); --err:#FF6464; --err-soft:rgba(255,100,100,.13);
  --star:#FFB547; --shadow:0 10px 40px rgba(0,0,0,.45);
  --f-brand:"Unbounded","Geist",system-ui,sans-serif;
  --f-body:"Geist","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E4E8EE; --ink:#0E1116; --muted:#5C6573; --line:#E1E5EA;
  --accent:#E8541A; --accent-2:#F59E0B; --accent-ink:#FFFFFF; --glow:rgba(232,84,26,.10); --head:rgba(243,244,246,.8); --scrim:rgba(14,17,22,.35);
  --ok:#138A4F; --ok-soft:#E3F5EB; --warn:#A96300; --warn-soft:#FDF1DC; --err:#CF3434; --err-soft:#FCE6E6;
  --star:#E08A00; --shadow:0 10px 40px rgba(14,17,22,.10); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F1F3F6; --surface-3:#E4E8EE; --ink:#0E1116; --muted:#5C6573; --line:#E1E5EA;
  --accent:#E8541A; --accent-2:#F59E0B; --accent-ink:#FFFFFF; --glow:rgba(232,84,26,.10); --head:rgba(243,244,246,.8); --scrim:rgba(14,17,22,.35);
  --ok:#138A4F; --ok-soft:#E3F5EB; --warn:#A96300; --warn-soft:#FDF1DC; --err:#CF3434; --err-soft:#FCE6E6;
  --star:#E08A00; --shadow:0 10px 40px rgba(14,17,22,.10); color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
.no-claude [data-chat-open],.no-claude .fab,.no-claude [data-chat-ask]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 85% -120px,var(--glow),transparent 70%),radial-gradient(700px 360px at -10% 10%,var(--glow),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--head);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-block:12px;padding-inline:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-brand);font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--ink);background:none;border:0;padding:0}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);box-shadow:0 4px 18px var(--glow)}
.logo svg{width:18px;height:18px}
.brand em{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.cur-select{appearance:none;-webkit-appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;font-weight:600;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.icon-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.icon-btn:hover,.cur-select:hover{border-color:var(--muted)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.on{border-color:var(--accent);color:var(--accent)}
.icon-btn.ai{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink)}
@media (max-width:820px){.tabs{order:3;width:100%}.tabs button{flex:1}}
@media (max-width:560px){.icon-btn .lbl{display:none}.brand span.w{display:none}}

/* steps */
.steps{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;transition:.15s}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;background:var(--surface-2);color:var(--muted)}
.step.ok .n{background:var(--ok-soft);color:var(--ok)}
.step.warn .n{background:var(--warn-soft);color:var(--warn)}
.step.err .n{background:var(--err-soft);color:var(--err)}
.step:hover{color:var(--ink);border-color:var(--muted)}
.step.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.on .n{background:var(--bg);color:var(--ink)}

/* converter popover */
.conv{position:absolute;right:20px;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;z-index:50}
.conv h3{margin:0 0 2px;font-size:16px;font-weight:600}
.conv .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.conv-grid{display:grid;gap:10px}
.conv-row{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px}
.conv input,.conv select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.conv input{font-family:var(--f-mono);font-size:16px}
.swap{justify-self:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:transform .2s}
.swap:hover{transform:rotate(180deg);border-color:var(--accent)}
.swap svg{width:16px;height:16px}
.conv-out{background:linear-gradient(135deg,var(--glow),transparent);border:1px solid var(--line);border-radius:12px;padding:14px}
.conv-out .big{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em;overflow-wrap:anywhere}
.conv-out .rate{font-size:12.5px;color:var(--muted)}
.conv-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.quick button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted)}
.quick button:hover{color:var(--ink);border-color:var(--muted)}
@media (max-width:560px){.conv{right:16px}}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.shell.full{grid-template-columns:minmax(0,1fr)}
.shell.full .console{display:none}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr);padding-bottom:120px}}
@media (max-width:560px){.shell,.top-in,.steps{padding-inline:16px}}

h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.1}
h2{font-size:19px;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.main-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 20px var(--glow)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sel{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.link{background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit}
.link:hover{color:var(--accent)}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;padding:10px 0;width:100%;min-width:0;outline:none}
.search:focus-within{border-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:99px;background:var(--surface-3);position:relative;margin:0;cursor:pointer;transition:.2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:17px;background:var(--accent-ink)}

/* part cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--surface-3);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 40px var(--glow)}
.card.bad{opacity:.62}
.card.bad:hover{opacity:.92}
.card-top{display:flex;gap:12px;align-items:flex-start;padding-right:64px}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
.thumb svg{width:26px;height:26px}
.pbrand{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.pname{font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.err{background:var(--err-soft);color:var(--err)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.rating{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.rating b{color:var(--star);font-weight:600}
.msgs{display:grid;gap:4px;font-size:13px}
.msg{display:flex;gap:7px;align-items:flex-start}
.msg b{font-family:var(--f-mono)}
.msg.warn{color:var(--warn)}.msg.err{color:var(--err)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap}
.card-foot .acts{display:flex;gap:6px}
.price{font-weight:700;font-size:18px;letter-spacing:-.02em}
.price small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* build console */
.console{position:sticky;top:calc(env(safe-area-inset-top,0px) + 128px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.c-head{padding:18px 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}.pill.idle{background:var(--surface-2);color:var(--muted)}
.gauge{display:flex;align-items:center;gap:16px;margin:0 18px 12px;padding:14px;border-radius:14px;background:var(--surface-2)}
.gauge svg{width:76px;height:76px;flex:none}
.gauge .g-l{font-size:12px;color:var(--muted)}
.gauge .g-v{font-family:var(--f-mono);font-size:20px;font-weight:500}
.gauge .g-s{font-size:12.5px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0 8px 6px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.row:hover{background:var(--surface-2)}
.row .ri{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);position:relative}
.row:hover .ri{background:var(--surface-3)}
.row .ri svg{width:16px;height:16px}
.row .ri i{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.row .ri i.ok{background:var(--ok)}.row .ri i.warn{background:var(--warn)}.row .ri i.err{background:var(--err)}
.row .ri.filled{color:var(--accent)}
.row .k{font-size:11px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.row .v{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v.none{color:var(--muted);font-weight:400}
.row .p{font-size:13px;color:var(--muted)}
.c-total{margin:4px 18px 0;padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.c-total .lab{font-size:13px;color:var(--muted)}
.c-total strong{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1}
.c-total .alt{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.c-actions{padding:0 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c-actions .btn.primary{grid-column:1/-1}
.close-sheet{display:none}

/* mobile */
.mbar{display:none}
.scrim{display:none}
@media (max-width:980px){
  .console{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;border-radius:22px 22px 0 0;max-height:85vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
  .console.open{transform:none}
  .shell.full .console{display:block}
  .close-sheet{display:inline-flex}
  .mbar{display:flex;position:fixed;left:12px;right:84px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px;align-items:center;gap:12px;box-shadow:var(--shadow)}
  .mbar .t{font-weight:700;font-size:18px;letter-spacing:-.02em}
  .mbar .s{font-size:12px;color:var(--muted)}
  .mbar .btn{margin-left:auto}
  .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:55}
}

/* start + hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:clamp(24px,4vw,44px);background:var(--surface);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:auto -10% -60% 40%;height:120%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero h1{font-family:var(--f-brand);font-size:clamp(30px,5vw,52px);font-weight:700;line-height:1.02;letter-spacing:-.03em;max-width:14ch}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:16px;position:relative}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:24px;position:relative}
.stat .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat .l{font-size:12.5px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
.preset{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;transition:.15s}
.preset:hover{border-color:var(--accent);box-shadow:0 10px 40px var(--glow)}
.preset .tier{display:flex;gap:6px;flex-wrap:wrap}
.preset .tier span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--glow);padding:3px 7px;border-radius:6px}
.preset h3{font-size:19px;font-weight:600}
.preset p{margin:0;color:var(--muted);font-size:14px}
.preset ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px}
.preset li{display:flex;gap:8px;align-items:center}
.preset li svg{width:14px;height:14px;color:var(--muted);flex:none}
.preset .pp{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.preset .pp .acts{display:flex;gap:6px}
.section{margin-top:36px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.saved{display:grid;gap:8px;margin-top:12px}
.saved-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.saved-row .nm{font-weight:600}
.saved-row .meta{font-size:13px;color:var(--muted)}
.saved-row .acts{margin-left:auto;display:flex;gap:6px}

/* best picks */
.picks-group{margin-top:22px}
.picks-group h3{font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.picks-group h3 svg{width:16px;height:16px;color:var(--accent)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.pick .award{align-self:flex-start;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.pick .why{font-size:13.5px;color:var(--muted)}
.pick .row2{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}

/* review page */
.report{display:grid;gap:8px;margin-bottom:22px}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:12px;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.check-item.err{background:var(--err-soft);border-color:transparent}
.check-item.warn{background:var(--warn-soft);border-color:transparent}
.check-item.ok{background:var(--ok-soft);border-color:transparent}
.check-item .ic{font-family:var(--f-mono);font-weight:600;min-width:16px}
.check-item.err .ic{color:var(--err)}.check-item.warn .ic{color:var(--warn)}.check-item.ok .ic{color:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0;font-size:18px;letter-spacing:-.02em}
.save-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.save-row input{flex:1 1 220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:0}
.note{font-size:12.5px;color:var(--muted);margin-top:24px}
.note a{color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.banner .btn{padding:5px 10px;font-size:13px}
.banner span{flex:1 1 220px}

/* 3D */
.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.stage-wrap{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:radial-gradient(ellipse at 50% 40%,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:22px;overflow:hidden;aspect-ratio:4/3;max-width:100%;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.stage{background:#05030d;border-color:rgba(0,229,255,.35);box-shadow:0 0 0 1px rgba(255,43,214,.12),0 0 40px rgba(0,229,255,.12),inset 0 0 60px rgba(0,229,255,.06)}
.stage::before,.stage::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #00e5ff;pointer-events:none;z-index:1;filter:drop-shadow(0 0 6px #00e5ff)}
.stage::before{top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.stage::after{top:10px;right:10px;border-left:0;border-bottom:0;border-top-right-radius:8px}
.stage-readout{position:absolute;top:18px;left:24px;display:grid;gap:3px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:#8fdcff;pointer-events:none;z-index:1;text-shadow:0 0 8px rgba(0,229,255,.6)}
.stage-readout b{color:#fff;font-weight:600;letter-spacing:.14em}
.stage-readout em{font-style:normal;color:#ff7be5}
.stage .stage-hint{background:rgba(5,3,13,.65);color:#bfe9ff;border:1px solid rgba(0,229,255,.25)}
.stage .stage-ctrls .btn{background:rgba(5,3,13,.65);color:#e6f7ff;border-color:rgba(0,229,255,.3)}
.stage .stage-ctrls .btn.on{border-color:#00e5ff;color:#00e5ff;box-shadow:0 0 12px rgba(0,229,255,.35)}
.stage .tip{background:rgba(5,3,13,.85);color:#e6f7ff;border:1px solid #00e5ff;box-shadow:0 0 14px rgba(0,229,255,.35)}
@media (max-width:560px){.stage-readout{font-size:10px;left:18px}}
.stage-hud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-end;pointer-events:none}
.stage-hud > *{pointer-events:auto}
.stage-hint{font-size:12px;color:var(--muted);background:var(--head);backdrop-filter:blur(8px);padding:6px 10px;border-radius:8px}
.stage-ctrls{display:flex;gap:6px;flex-wrap:wrap}
.stage-ctrls .btn{background:var(--head);backdrop-filter:blur(8px)}
.stage-ctrls .btn.on{border-color:var(--accent);color:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap;z-index:2}
.stage-fallback{position:absolute;inset:0 0 60px 0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.legend h2{padding:10px 10px 6px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;width:100%;text-align:left;background:none;border:0}
.lg:hover,.lg.on{background:var(--surface-2)}
.lg i{width:12px;height:12px;border-radius:4px}
.lg .k{font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lg .v{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .v.none{color:var(--muted);font-weight:400}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:90;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.dscrim{position:fixed;inset:0;background:var(--scrim);z-index:85}
.d-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.d-body{padding:20px;display:grid;gap:22px}
.d-hero{display:flex;gap:16px;align-items:flex-start}
.d-hero .thumb{width:72px;height:72px;border-radius:18px}
.d-hero .thumb svg{width:40px;height:40px}
.btn.st-open{width:100%;justify-content:center;border:1px solid var(--accent);color:var(--accent);background:var(--glow);font-weight:600}
.btn.st-open:hover{background:var(--accent);color:var(--accent-ink)}
.card-img{height:140px;border-radius:12px;background:#fff;overflow:hidden;flex:none}
.card-img img{display:block;width:100%;height:100%;object-fit:contain;padding:10px;box-sizing:border-box}
.thumb.has-img{background:#fff;overflow:hidden}
.thumb.has-img svg{display:none}
.thumb img{display:block;width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box}
.d-hero .thumb.d-img.has-img{width:180px;height:140px}
.d-hero h2{font-size:22px;line-height:1.2}
.d-buy{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:14px;padding:14px 16px}
.d-desc{margin:0;font-size:15px;line-height:1.6}
.specs{width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.specs td{padding:9px 14px;font-size:14px}
.specs td:first-child{color:var(--muted);width:42%}
.specs tr:last-child td{border-bottom:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stars{display:inline-flex;gap:1px;color:var(--star);letter-spacing:0}
.stars .off{color:var(--surface-3)}
.rv-sum{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.rv-sum .avg{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
.rv-list{display:grid;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rv-top img{width:26px;height:26px;border-radius:50%}
.rv-top .who{font-weight:600;font-size:14px}
.rv-top .when{font-size:12px;color:var(--muted)}
.rv-top .del{margin-left:auto}
.rv p{margin:8px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.form{display:grid;gap:8px;margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.form textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:72px;resize:vertical;width:100%}
.form textarea:focus{outline:none;border-color:var(--accent)}
.form .frow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.star-pick{display:flex;gap:2px}
.star-pick button{background:none;border:0;padding:2px;font-size:22px;line-height:1;color:var(--surface-3)}
.star-pick button.on{color:var(--star)}
.muted{color:var(--muted);font-size:13.5px}

.trend{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}.trend span{opacity:.75}
.ph-ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ph-ctrls .seg button{padding:5px 10px;font-size:13px}
.ph-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (max-width:480px){.ph-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ph-stats>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.ph-stats .k{font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph-stats .v{font-weight:700;font-size:16px;letter-spacing:-.01em}
.ph-stats .v.sm{font-size:13px;font-weight:600}
.ph-chart{position:relative;border:1px solid var(--line);border-radius:14px;padding:8px 4px 0;touch-action:pan-y}
.ph-chart svg{display:block}
.ph-tip{position:absolute;transform:translate(-50%,-120%);background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:2}
.ph-tip .p{font-weight:700;font-size:14px}
.ph-tip .d{opacity:.8}
.ph-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.ph-legend span{display:inline-flex;align-items:center;gap:6px}
.ph-legend i{display:inline-block;width:18px;height:0}
.l-line{border-top:2px solid var(--accent)}.l-dash{border-top:2px dashed var(--accent)}.l-band{height:10px!important;background:var(--accent);opacity:.2;border-radius:3px}
.ph-sum{margin:10px 0 0;font-size:14.5px;line-height:1.55}
.ph-data{margin-top:10px;font-size:13.5px}.ph-data summary{cursor:pointer;color:var(--muted)}.ph-data .tbl-wrap{margin-top:8px;max-height:220px;overflow:auto}
.dm{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.dm-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dm-label{font-weight:700;font-size:16px}
.dm-trend{font-size:12.5px;color:var(--muted);font-weight:500}
.dm-score{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.dm-bar{height:8px;border-radius:99px;background:var(--surface-3);margin:10px 0;overflow:hidden}
.dm-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.dm p{margin:0;font-size:14.5px;line-height:1.55}
/* chat */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px var(--glow),var(--shadow);transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:26px;height:26px}
@media (max-width:980px){.fab{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:62px;height:62px}}
.chat{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:95;width:min(420px,calc(100vw - 32px));height:min(640px,calc(100vh - 110px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:560px){.chat{inset:0;width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.ch-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch-head .logo{width:34px;height:34px}
.ch-head .t{font-weight:600}
.ch-head .s{font-size:12px;color:var(--muted)}
.ch-head .btn{margin-left:auto}
.ch-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.bub.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.bub.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bub.bot p{margin:0 0 8px}.bub.bot p:last-child{margin:0}
.bub.bot ul,.bub.bot ol{margin:4px 0 8px;padding-left:20px}
.bub.bot code{font-family:var(--f-mono);font-size:13px;background:var(--surface-3);padding:1px 5px;border-radius:5px}
.bub.err{background:var(--err-soft);color:var(--err)}
.thinking span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chip-part{display:inline-flex;align-items:center;gap:6px;margin:3px 2px;padding:4px 10px;border-radius:99px;border:1px solid var(--accent);background:var(--glow);color:var(--ink);font-size:13px;font-weight:600;vertical-align:middle}
.chip-part:hover{background:var(--accent);color:var(--accent-ink)}
.chip-part.in{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sugg button{font-size:12.5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.sugg button:hover{border-color:var(--accent)}
.ch-foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.ch-foot textarea{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;resize:none;max-height:120px;min-height:44px}
.ch-foot textarea:focus{outline:none;border-color:var(--accent)}
.ch-foot .btn{height:44px}
.ch-note{font-size:11.5px;color:var(--muted);text-align:center;padding:0 12px 10px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (min-width:981px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

function autoDesc(p){
  switch(p.cat){
    case 'cpu':return `${p.cores} cores and ${p.threads} threads on ${p.socket}, boosting to ${p.boost} GHz. ${p.igpu?'Integrated graphics included, so it can run without a graphics card.':'No integrated graphics, so pair it with a graphics card.'} ${p.power>=200?'A high-power chip: plan for a 240 mm AIO or a large dual-tower cooler.':p.power>=140?'Pair it with a solid tower cooler.':'Runs cool on a mid-range air cooler.'}`;
    case 'mb':return `${p.form} board for ${p.socket} processors with ${p.ramSlots} ${p.ramType} slots and ${p.m2} M.2 slot${p.m2>1?'s':''}. ${p.form==='ITX'?'Built for compact small-form-factor builds.':p.form==='mATX'?'A good balance of size and expansion for most builds.':'Full-size layout with plenty of room for expansion.'}`;
    case 'ram':return `${p.cap} GB of ${p.type}-${p.speed} as ${p.sticks} × ${p.cap/p.sticks} GB. ${p.cap<=16?'Covers everyday use and esports.':p.cap<=32?'The sweet spot for gaming and multitasking.':p.cap<=64?'Plenty for creators, big projects and virtual machines.':'Workstation capacity for huge datasets and local AI.'}`;
    case 'gpu':return `A ${p.vram} GB graphics card drawing about ${p.power} W, ${p.length} mm long. ${p.power>=300||p.vram>=24?'Built for 4K gaming and heavy GPU work.':p.vram>=16?'Strong at 1440p, with enough memory for entry-level 4K.':p.vram>=12?'Great for high-refresh 1080p and 1440p gaming.':'A solid pick for 1080p gaming.'}`;
    case 'storage':return p.hdd?`${p.capacity} hard drive for bulk storage, backups and media. Not recommended as a boot drive.`:p.iface==='SATA'?`${p.capacity} SATA SSD at up to ${p.speed} MB/s. Great as extra storage or for systems without free M.2 slots.`:`${p.capacity} ${p.speed>10000?'PCIe 5.0':'PCIe 4.0'} NVMe drive at up to ${p.speed.toLocaleString()} MB/s. Fast boots and quick game loads.`;
    case 'cooler':return p.type==='AIO'?`A ${p.rad} mm all-in-one liquid cooler rated for about ${p.maxTdp} W. Needs a case with a ${p.rad} mm radiator mount.`:`A ${p.dual?'dual-tower':'single-tower'} air cooler, ${p.height} mm tall, rated for about ${p.maxTdp} W. Check your case's cooler clearance.`;
    case 'psu':return `${p.watts} W ${p.rating} ${p.sfx?'SFX power supply for small-form-factor cases.':'ATX power supply.'} ${p.watts>=1000?'Ready for flagship graphics cards.':p.watts>=750?'Good headroom for high-end gaming builds.':'Right-sized for mainstream builds.'}`;
    case 'case':return `Supports ${p.forms.join(', ')} motherboards, graphics cards up to ${p.maxGpu} mm and coolers up to ${p.maxCooler} mm${p.maxRad?`, with room for a ${p.maxRad} mm radiator`:''}.${p.sfxOnly?' Requires an SFX power supply.':''}`;
  }
}

/* part photos: PIMG (parts-images.js) maps id -> [url, backup urls]. Broken links fall through to the next, then to the icon (or nothing). */
function photo(p,cls,fallback=''){const u=((window.PIMG||{})[p.id]||[]);if(!u.length)return fallback?`<div class="${cls}">${fallback}</div>`:'';
  return `<div class="${cls} has-img" data-fb="${fallback?1:0}"><img src="${esc(u[0])}" data-alt="${esc(u.slice(1).join(' '))}" alt="${esc(p.brand+' '+p.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="imgFail(this)">${fallback}</div>`}
function imgFail(el){const rest=(el.dataset.alt||'').split(' ').filter(Boolean);if(rest.length){el.dataset.alt=rest.slice(1).join(' ');el.src=rest[0];return}
  const box=el.parentNode;box.classList.remove('has-img');el.remove();if(box.dataset.fb==='0')box.remove()}

/* compatibility */
const BASE_W=60;
const load=b=>BASE_W+(b.cpu?.power||0)+(b.gpu?.power||0);
const recPsu=w=>Math.ceil(w*1.3/50)*50;
const RULES=[
  {needs:['cpu','mb'],check:b=>b.cpu.socket!==b.mb.socket&&{level:'err',msg:`Socket mismatch: CPU is ${b.cpu.socket}, board is ${b.mb.socket}.`}},
  {needs:['ram','mb'],check:b=>b.ram.type!==b.mb.ramType&&{level:'err',msg:`Board takes ${b.mb.ramType}; this kit is ${b.ram.type}.`}},
  {needs:['ram','mb'],check:b=>b.ram.sticks>b.mb.ramSlots&&{level:'err',msg:`${b.ram.sticks} sticks, but the board has ${b.mb.ramSlots} slots.`}},
  {needs:['case','mb'],check:b=>!b.case.forms.includes(b.mb.form)&&{level:'err',msg:`${b.mb.form} board won't fit. Case takes ${b.case.forms.join(', ')}.`}},
  {needs:['gpu','case'],check:b=>!b.gpu.none&&b.gpu.length>b.case.maxGpu&&{level:'err',msg:`Card is ${b.gpu.length} mm; case fits up to ${b.case.maxGpu} mm.`}},
  {needs:['cooler','case'],check:b=>b.cooler.type==='Air'?(b.cooler.height>b.case.maxCooler&&{level:'err',msg:`Cooler is ${b.cooler.height} mm tall; case allows ${b.case.maxCooler} mm.`}):(b.cooler.rad>b.case.maxRad&&{level:'err',msg:b.case.maxRad?`${b.cooler.rad} mm radiator; case fits up to ${b.case.maxRad} mm.`:`This case has no radiator mount. Use an air cooler.`})},
  {needs:['psu','case'],check:b=>b.case.sfxOnly&&!b.psu.sfx&&{level:'err',msg:`${b.case.name} needs an SFX power supply.`}},
  {needs:['cooler','cpu'],check:b=>!b.cooler.sockets.includes(b.cpu.socket)&&{level:'err',msg:`Cooler doesn't support ${b.cpu.socket}.`}},
  {needs:['cooler','cpu'],check:b=>b.cooler.sockets.includes(b.cpu.socket)&&b.cooler.maxTdp<b.cpu.power&&{level:'warn',msg:`Cooler handles ~${b.cooler.maxTdp} W; CPU can pull ${b.cpu.power} W. Expect throttling.`}},
  {needs:['gpu','cpu'],check:b=>b.gpu.none&&!b.cpu.igpu&&{level:'err',msg:`${b.cpu.name} has no integrated graphics. Add a graphics card.`}},
  {needs:['psu','cpu'],also:['gpu'],check:b=>{const w=load(b),r=recPsu(w);
    if(b.psu.watts<w)return{level:'err',msg:`Estimated load ${w} W exceeds this ${b.psu.watts} W PSU.`};
    if(b.psu.watts<r)return{level:'warn',msg:`Tight headroom at ${w} W. We recommend ${r} W or more.`};return false}}
];
function resolve(ids){const b={};for(const k in ids){if(ids[k]&&BYID[ids[k]])b[k]=BYID[ids[k]]}return b}
function evaluate(ids){const b=resolve(ids),out=[];for(const r of RULES){if(!r.needs.every(k=>b[k]))continue;const res=r.check(b);if(res)out.push({...res,cats:[...r.needs,...(r.also||[])]})}return out}
function issuesFor(cat,ids){return evaluate(ids).filter(i=>i.cats.includes(cat))}
function worst(l){return l.some(i=>i.level==='err')?'err':l.some(i=>i.level==='warn')?'warn':'ok'}
const total=ids=>Object.values(resolve(ids)).reduce((s,p)=>s+p.price,0);

function fmtIn(code,amount){const x=CUR[code];return x.s+(x.s.length>1?' ':'')+amount.toLocaleString('en-US',{minimumFractionDigits:x.d,maximumFractionDigits:x.d})}
function convert(amount,from,to){return amount/CUR[from].r*CUR[to].r}
function money(thb){return fmtIn(cur,thb*CUR[cur].r)}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tags(p){switch(p.cat){
  case 'cpu':return[p.socket,`${p.cores}C/${p.threads}T`,`${p.boost} GHz`,`${p.power} W`,p.igpu?'iGPU':'No iGPU'];
  case 'mb':return[p.socket,p.form,p.ramType,`${p.ramSlots} DIMM`,`${p.m2}× M.2`];
  case 'ram':return[p.type,`${p.sticks}×${p.cap/p.sticks} GB`,`${p.speed} MT/s`];
  case 'gpu':return p.none?['0 W','Needs CPU with iGPU']:[`${p.vram} GB`,`${p.power} W`,`${p.length} mm`];
  case 'storage':return[p.iface,p.capacity,`${p.speed.toLocaleString()} MB/s`];
  case 'cooler':return[p.type,p.type==='Air'?`${p.height} mm`:`${p.rad} mm rad`,`~${p.maxTdp} W`];
  case 'psu':return[`${p.watts} W`,p.rating];
  case 'case':return[p.forms.join('/'),`GPU ≤${p.maxGpu}`,`Cooler ≤${p.maxCooler}`,`Rad ≤${p.maxRad}`];
}}
function specRows(p){switch(p.cat){
  case 'cpu':return[['Socket',p.socket],['Cores / threads',`${p.cores} / ${p.threads}`],['Max boost',`${p.boost} GHz`],['Peak power',`${p.power} W`],['Integrated graphics',p.igpu?'Yes':'No']];
  case 'mb':return[['Socket',p.socket],['Form factor',p.form],['Memory',p.ramType],['DIMM slots',p.ramSlots],['M.2 slots',p.m2]];
  case 'ram':return[['Type',p.type],['Capacity',`${p.cap} GB`],['Configuration',`${p.sticks} × ${p.cap/p.sticks} GB`],['Speed',`${p.speed} MT/s`]];
  case 'gpu':return p.none?[['Power','0 W'],['Requirement','CPU with integrated graphics']]:[['Memory',`${p.vram} GB`],['Board power',`${p.power} W`],['Length',`${p.length} mm`],['Recommended PSU',`${recPsu(BASE_W+120+p.power)} W+`]];
  case 'storage':return[['Interface',p.iface],['Capacity',p.capacity],['Sequential read',`${p.speed.toLocaleString()} MB/s`]];
  case 'cooler':return[['Type',p.type==='AIO'?'All-in-one liquid':'Air'],[p.type==='Air'?'Height':'Radiator',p.type==='Air'?`${p.height} mm`:`${p.rad} mm`],['Cooling capacity',`~${p.maxTdp} W`],['Sockets',p.sockets.join(', ')]];
  case 'psu':return[['Wattage',`${p.watts} W`],['Efficiency',p.rating]];
  case 'case':return[['Motherboards',p.forms.join(', ')],['Max GPU length',`${p.maxGpu} mm`],['Max cooler height',`${p.maxCooler} mm`],['Max radiator',`${p.maxRad} mm`]];
}}

/* ---------- price history, forecast, demand (simulated for the demo catalog) ---------- */
const NOW=new Date(2026,8,30);
let priceRange='1y', fcH=6;
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ageMonths(p){const n=p.brand+' '+p.name;
  if(/RTX 50|RX 90|RX 9060|Arc B|9[6-9]00X|9800X3D|9950X3D|Core Ultra|Z890|B860|X870|990 EVO Plus|T705|NV3|Phantom Spirit|Galahad II|Vertex|Dark Rock Pro 5|NH-D15 G2|Liquid Freezer III|Terra|O11 Vision|NV7|Lancool 207|SP850|Aqua Elite/.test(n))return 8+hashStr(p.id)%12;
  if(/5600|5700X3D|B550|A520|DDR4|RTX 3050|H610|MX500|870 EVO|BarraCuda|AK400|NH-U12S|SE-214|MWE|Smart 500|RM850x|4000D|NR200P|RX 7600|RX 7700|Red Plus|IronWolf|RTX 4060/.test(n))return 40+hashStr(p.id)%14;
  return 20+hashStr(p.id)%14;}
const HIST={};
function history(p){
  if(HIST[p.id])return HIST[p.id];
  const r=rng(hashStr(p.id)),age=ageMonths(p),weeks=Math.round(age*4.345),isGpu=p.cat==='gpu';
  const prem=0.1+r()*0.22+(isGpu?0.06:0),tau=weeks*(0.3+r()*0.3),eol=age>44;
  const raw=[];let n=0;
  for(let i=0;i<=weeks;i++){
    n=n*0.82+(r()-0.5)*0.028;
    let v=1+prem*Math.exp(-i/tau);
    if(eol&&i>weeks-22)v+=0.05*(i-(weeks-22))/22;
    const d=new Date(NOW.getTime()-(weeks-i)*7*864e5),m=d.getMonth(),day=d.getDate();
    if((m===10&&day>=6&&day<=17)||(m===11&&day>=7&&day<=18))v*=0.95;
    raw.push({t:d,v:v+n*(i<weeks-1?1:0)});
  }
  const end=raw[raw.length-1].v;
  const out=raw.map(x=>({t:x.t,p:Math.max(10,Math.round(p.price*x.v/end/10)*10)}));
  out[out.length-1].p=p.price;
  return HIST[p.id]=out;
}
function forecast(p,months){
  const hs=history(p),W=Math.min(26,hs.length-1),seg=hs.slice(-W-1);
  const xs=seg.map((_,i)=>i),ys=seg.map(x=>Math.log(x.p)),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
  let b=den?num/den*0.6:0;const res=Math.sqrt(ys.reduce((s,y,i)=>s+(y-(my+b/0.6*(xs[i]-mx)))**2,0)/Math.max(1,ys.length-2));
  if(ageMonths(p)<14)b-=0.0012;
  b=Math.max(-0.007,Math.min(0.007,b));
  const weeks=Math.round(months*4.345),cur=p.price,pts=[];
  for(let k=1;k<=weeks;k++){const mid=cur*Math.exp(b*k),z=Math.max(0.006,res)*Math.sqrt(k)*1.5+0.002*k;
    const r10=v=>Math.round(v/10)*10;pts.push({t:new Date(NOW.getTime()+k*7*864e5),p:r10(mid),lo:r10(mid*Math.exp(-z)),hi:r10(mid*Math.exp(z)),fc:true})}
  return pts;
}
function trendPct(p,weeks){const hs=history(p);if(hs.length<2)return 0;const a=hs[Math.max(0,hs.length-1-weeks)].p;return (p.price-a)/a*100}
function trendChip(p){if(!p.price)return'';const t=trendPct(p,13);const a=Math.abs(t);
  return `<span class="trend">${a<1?'→ Steady':t<0?`▼ ${a.toFixed(0)}%`:`▲ ${a.toFixed(0)}%`} <span>3 mo</span></span>`}
function demand(p){
  const r=rng(hashStr(p.id+'d'));let s=34+r()*30;
  const inB=BUILDS.filter(b=>Object.values(b.build).includes(p.id)).length;s+=Math.min(22,inB*6);
  const award=BEST.find(x=>x.id===p.id);if(award)s+=12;
  const age=ageMonths(p);if(age<14)s+=8;if(age>44)s-=10;
  const rt=ratingOf(p.id);if(rt)s+=(rt.avg-3)*5+Math.min(8,rt.n);
  if(p.none)s=20;
  s=Math.round(Math.max(5,Math.min(98,s)));
  const trend=age<14?'rising':age>44?'cooling':(r()<0.55?'steady':'rising');
  return{score:s,trend,inB,award,rt};
}
function demandSentence(p,d){
  const c=catLabel(p.cat).toLowerCase(),label=d.score>=80?'Very popular':d.score>=60?'Popular':d.score>=40?'Moderate demand':'Niche pick';
  let s=d.score>=80?`One of the most-wanted ${c} parts right now. Builders love it${d.award?` as our “${d.award.award}” pick`:''}, so stock can sell out quickly.`
    :d.score>=60?`A well-liked choice with steady interest from builders${d.award?`, and our “${d.award.award}” pick`:''}.`
    :d.score>=40?`A solid option that fewer builders choose, so it's usually easy to find in stock.`
    :`A specialist part with lower demand. A great pick if it matches exactly what you need.`;
  s+=d.trend==='rising'?' Interest is rising.':d.trend==='cooling'?' Interest is cooling as newer parts arrive.':' Interest is holding steady.';

  if(d.rt)s+=` Rated ${d.rt.avg.toFixed(1)}/5 by ${d.rt.n} RigForge builder${d.rt.n>1?'s':''}.`;

}
const RANGES=[['3m','3M',13],['6m','6M',26],['1y','1Y',52],['2y','2Y',104],['all','All',1e9]];
function fmtShort(v){const x=CUR[cur];const abs=Math.abs(v);const sp=x.s.length>1?' ':'';
  if(abs>=1e6)return x.s+sp+(v/1e6).toFixed(abs>=1e7?0:1)+'M';if(abs>=1e4)return x.s+sp+Math.round(v/1e3)+'k';if(abs>=1e3)return x.s+sp+(v/1e3).toFixed(1)+'k';return x.s+sp+v.toFixed(abs<10?2:0)}
function niceStep(span,n){const raw=span/n,pw=10**Math.floor(Math.log10(raw)),f=raw/pw;return (f<1.5?1:f<3?2:f<7?5:10)*pw}
function renderPriceSec(){

  el.innerHTML=`

      <div class="seg" role="group" aria-label="Forecast length">${[3,6,12].map(m=>`<button data-fch="${m}" class="${fcH===m?'on':''}">+${m} mo</button>`).join('')}</div></div>

function drawPriceChart(p,seg,fc){
  const box=$('#phChart');const W=Math.max(280,box.clientWidth||480),H=230,m={l:52,r:14,t:16,b:28};
  const k=CUR[cur].r,t0=seg[0].t.getTime(),t1=fc[fc.length-1].t.getTime(),tn=NOW.getTime();
  let ymin=Math.min(...seg.map(x=>x.p),...fc.map(x=>x.lo))*k,ymax=Math.max(...seg.map(x=>x.p),...fc.map(x=>x.hi))*k;
  const pad=(ymax-ymin)*0.12||ymax*0.05;ymin-=pad;ymax+=pad;
  const st=niceStep(ymax-ymin,4);ymin=Math.floor(ymin/st)*st;ymax=Math.ceil(ymax/st)*st;if(ymin<0)ymin=0;
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(1-(v-ymin)/(ymax-ymin))*(H-m.t-m.b);
  const line=pts=>pts.map((q,i)=>`${i?'L':'M'}${X(q.t.getTime()).toFixed(1)},${Y(q.p*k).toFixed(1)}`).join('');
  const last=seg[seg.length-1],fcl=[last,...fc];
  const band=[{t:last.t,hi:last.p,lo:last.p},...fc];
  const bandPath=band.map((q,i)=>`${i?'L':'M'}${X(q.t.getTime()).toFixed(1)},${Y(q.hi*k).toFixed(1)}`).join('')+[...band].reverse().map(q=>`L${X(q.t.getTime()).toFixed(1)},${Y(q.lo*k).toFixed(1)}`).join('')+'Z';
  const area=line(seg)+`L${X(tn).toFixed(1)},${Y(ymin).toFixed(1)}L${X(t0).toFixed(1)},${Y(ymin).toFixed(1)}Z`;
  let grid='';for(let v=ymin;v<=ymax+1e-9;v+=st){const y=Y(v).toFixed(1);grid+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${+y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${fmtShort(v)}</text>`}
  const spanM=(t1-t0)/(30.44*864e5),stepM=spanM<=5?1:spanM<=10?2:spanM<=20?3:spanM<=40?6:12;
  let xt='';const d=new Date(seg[0].t.getFullYear(),seg[0].t.getMonth()+1,1);
  while(d.getTime()<=t1){if(d.getMonth()%stepM===0){const x=X(d.getTime());if(x>m.l+14&&x<W-m.r-14)xt+=`<line x1="${x}" x2="${x}" y1="${H-m.b}" y2="${H-m.b+4}" stroke="var(--line)"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${d.toLocaleDateString('en-GB',{month:'short'})}${d.getMonth()===0||stepM>=6?` ’${String(d.getFullYear()).slice(2)}`:''}</text>`}d.setMonth(d.getMonth()+1)}
  const xn=X(tn),yn=Y(p.price*k);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Price history and forecast for ${esc(p.name)}">
    <defs><linearGradient id="phg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xt}
    <path d="${area}" fill="url(#phg)"/>
    <path d="${bandPath}" fill="var(--accent)" fill-opacity=".13"/>
    <line x1="${xn}" x2="${xn}" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="2 4"/>
    <text x="${xn+6}" y="${m.t+10}" font-size="11" fill="var(--muted)">Today</text>
    <path d="${line(seg)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line(fcl)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
    <circle cx="${xn}" cy="${yn}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <g id="phHover" style="display:none"><line id="phX" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink)" stroke-opacity=".35"/><circle id="phDot" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>
    <rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="phHit"/>
  </svg><div class="ph-tip" id="phTip" hidden></div>`;
  const all=[...seg,...fc],hit=$('#phHit'),tip=$('#phTip');
  const move=e=>{const r=box.querySelector('svg').getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,t=t0+(sx-m.l)/(W-m.l-m.r)*(t1-t0);
    let best=all[0];for(const q of all)if(Math.abs(q.t-t)<Math.abs(best.t-t))best=q;
    const x=X(best.t.getTime()),y=Y(best.p*k);$('#phHover').style.display='';$('#phX').setAttribute('x1',x);$('#phX').setAttribute('x2',x);$('#phDot').setAttribute('cx',x);$('#phDot').setAttribute('cy',y);
    tip.hidden=false;tip.innerHTML=`<div class="d">${best.t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}${best.fc?' · estimate':''}</div><div class="p num">${money(best.p)}</div>${best.fc?`<div class="d">Likely ${money(best.lo)} – ${money(best.hi)}</div>`:''}`;
    const px=x*r.width/W;tip.style.left=Math.min(Math.max(px,70),r.width-70)+'px';tip.style.top=(y*r.height/H)+'px'};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;$('#phHover').style.display='none'});
}

function mdLite(src){
  let s=esc(src);
  s=s.replace(/\[\[([a-z0-9\-]+)\]\]/gi,(m,id)=>{const p=BYID[id];if(!p)return'';const inB=build[p.cat]===p.id;return `<button class="chip-part ${inB?'in':''}" data-pick-ai="${p.id}">${inB?'✓ In build':'+ Add'} · ${esc(p.name)}${p.price?' · '+money(p.price):''}</button>`});
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines=s.split('\n');let out='',list=null,para=[];
  const flushP=()=>{if(para.length){out+=`<p>${para.join('<br>')}</p>`;para=[]}};
  const flushL=()=>{if(list){out+=`<${list.t}>${list.items.map(i=>`<li>${i}</li>`).join('')}</${list.t}>`;list=null}};
  for(const ln of lines){
    const ul=ln.match(/^\s*[-*•]\s+(.*)/),ol=ln.match(/^\s*\d+[.)]\s+(.*)/),hd=ln.match(/^\s*#{1,4}\s+(.*)/);
    if(ul||ol){flushP();const t=ul?'ul':'ol';if(!list||list.t!==t){flushL();list={t,items:[]}}list.items.push((ul||ol)[1])}
    else if(!ln.trim()){flushP();flushL()}
    else if(hd){flushP();flushL();out+=`<p><strong>${hd[1]}</strong></p>`}
    else{flushL();para.push(ln)}
  }
  flushP();flushL();return out;
}

async function sendChat(text){

  chatBusy=true;renderChat();
  const turns=chatMsgs.slice(0,-1).filter(m=>!m.error&&m.content).slice(-12).map(m=>({role:m.role,content:m.content}));
  while(turns.length&&turns[0].role!=='user')turns.shift();

    }
  }finally{chatBusy=false;chatCtl=null;renderChat()}
}

  T.rgb.forEach(m=>{if(m.userData.hlOn)return;const c=rgbAt(m.userData.rgb,reduce?0:t);m.color.copy(c);m.emissive.copy(c);m.emissiveIntensity=m.userData.ei0??(m.userData.ei0=m.emissiveIntensity)});
  if(!reduce){T.spin.forEach(s=>{s.o.rotation.y+=s.v});T.anim.forEach(f=>f(t));
    if(T.dust){const a=T.dust.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)+0.04;if(y>50)y=-40;a.setY(i,y)}a.needsUpdate=true;T.dust.rotation.y=t*0.02}}
  if(T.composer)T.composer.render();else T.renderer.render(T.scene,T.camera);
}
function bindStage(stage){
  if(stage.dataset.bound)return;stage.dataset.bound='1';
  const cv=()=>T.renderer.domElement;
  const pts=new Map();
  stage.addEventListener('pointerdown',e=>{if(e.target.closest('.stage-hud'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);if(pts.size===1)T.drag={x:e.clientX,y:e.clientY};else if(pts.size===2){const [a,b]=[...pts.values()];T.pinch=Math.hypot(a.x-b.x,a.y-b.y);T.drag=null}});
  stage.addEventListener('pointermove',e=>{
    if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(T.pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);T.orbit.r=Math.max(40,Math.min(260,T.orbit.r*T.pinch/d));T.pinch=d;return}
    if(T.drag){T.orbit.th-=(e.clientX-T.drag.x)*0.008;T.orbit.ph-=(e.clientY-T.drag.y)*0.008;T.drag={x:e.clientX,y:e.clientY};$('#tip').hidden=true;return}
    const r=cv().getBoundingClientRect();T.mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    T.ray.setFromCamera(T.mouse,T.camera);const hits=T.ray.intersectObjects(Object.entries(T.groups).filter(([k])=>k!=='case').map(([,g])=>g),true);
    const tip=$('#tip');if(hits.length){let o=hits[0].object;while(o&&!o.userData.cat)o=o.parent;const k=o?.userData.cat;const p=resolve(build)[k];
      if(p){T.hl=k;tip.hidden=false;tip.textContent=`${catLabel(k)} · ${p.name}`;tip.style.left=(e.clientX-stage.getBoundingClientRect().left)+'px';tip.style.top=(e.clientY-stage.getBoundingClientRect().top)+'px';syncLegend();return}}
    tip.hidden=true;if(!T.legendHl){T.hl=null;syncLegend()}
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)T.pinch=null;if(pts.size===0)T.drag=null};
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('pointerleave',()=>{$('#tip').hidden=true;if(!T.legendHl){T.hl=null;syncLegend()}});
  stage.addEventListener('wheel',e=>{e.preventDefault();T.orbit.r=Math.max(40,Math.min(260,T.orbit.r*(1+Math.sign(e.deltaY)*0.08)))},{passive:false});
}
function syncLegend(){document.querySelectorAll('.lg').forEach(el=>el.classList.toggle('on',T&&T.hl===el.dataset.hl))}

/* ---------- events ---------- */
$('#cur').innerHTML=CURRENCIES.map(x=>`<option value="${x.c}" ${x.c===cur?'selected':''}>${x.s.length>1?x.c:x.s+' '+x.c}</option>`).join('');
function setCur(c){cur=c;$('#cur').value=c;store.set('rf-cur',c);render();if(drawerId)openDrawer(drawerId)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function go(s){view='build';if(s!==step)brandF='all';step=s;q='';closeSheet();render();window.scrollTo({top:0,behavior:'smooth'})}
function setView(v){view=v;closeSheet();render();window.scrollTo({top:0,behavior:'smooth'})}
function openSheet(){$('#sheet').classList.add('open');$('#scrim').hidden=false}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').hidden=true}
function openConv(fromTotal){if(fromTotal){conv.amt=total(build);conv.from='THB';if(conv.to==='THB')conv.to='USD'}closeSheet();renderConv();$('#conv').hidden=false;$('#convBtn').classList.add('on');$('#convBtn').setAttribute('aria-expanded','true')}
function closeConv(){$('#conv').hidden=true;$('#convBtn').classList.remove('on');$('#convBtn').setAttribute('aria-expanded','false')}
function pick(id,stay){const p=BYID[id];if(!p)return;const had=build[p.cat];build[p.cat]=p.id;loadedPreset=null;toast(`${had?'Swapped in':'Added'} ${p.name}`);
  if(!stay&&view==='build'&&!had){const idx=STEPS.indexOf(p.cat);if(STEPS[idx+1]!=='review'&&!build[STEPS[idx+1]]){go(STEPS[idx+1]);return}}
  render();if(drawerId)openDrawer(drawerId);if(!$('#chat').hidden)renderChat()}

document.addEventListener('click',e=>{
  const cv=$('#conv');
  if(!cv.hidden&&!e.target.closest('#conv')&&!e.target.closest('#convBtn')&&!e.target.closest('[data-openconv]'))closeConv();
  const t=e.target.closest('button,a');if(!t)return;
  const d=t.dataset;
  if(t.id==='convBtn'){cv.hidden?openConv(false):closeConv();return}
  if('openconv' in d){openConv(true);return}
  if(t.id==='cSwap'){[conv.from,conv.to]=[conv.to,conv.from];renderConv();return}
  if(d.qto){conv.to=d.qto;if(conv.from===conv.to)conv.from='THB';renderConv();return}
  if(t.id==='cUseTotal'){conv.amt=total(build);conv.from='THB';renderConv();return}
  if(t.id==='cShow'){setCur(conv.to);closeConv();toast(`Showing prices in ${CUR[conv.to].n}`);return}
  if('chatOpen' in d){openChat();return}
  if(d.chatAsk){closeDrawer();openChat();sendChat(d.chatAsk);return}
  if(t.id==='chClose'){closeChat();return}
  if(t.id==='chClear'){if(chatBusy)chatCtl?.abort();chatMsgs=[];renderChat();return}
  if(t.id==='chSend'&&chatBusy){e.preventDefault();chatCtl?.abort();return}
  if(d.pickAi){pick(d.pickAi,true);return}
  if(d.detail){openDrawer(d.detail);return}
  if(t.id==='dClose'){closeDrawer();return}
  if(d.prange){priceRange=d.prange;renderPriceSec();return}
  if(d.fch){fcH=+d.fch;renderPriceSec();return}
  if(d.star){reviewStars=+d.star;document.querySelectorAll('[data-star]').forEach(s=>{s.classList.toggle('on',+s.dataset.star<=reviewStars);s.setAttribute('aria-checked',String(+s.dataset.star===reviewStars))});return}
  if(d.delR){db?.doc('reviews/'+d.delR).delete().then(()=>toast('Review deleted'),()=>toast('Couldn’t delete that review'));return}
  if(d.delC){db?.doc('comments/'+d.delC).delete().then(()=>toast('Comment deleted'),()=>toast('Couldn’t delete that comment'));return}
  if(d.loadBuild){const bd=BUILDS.find(x=>x.id===d.loadBuild);build={...bd.build};loadedPreset=bd.name;toast(`Loaded ${bd.name}`);if(d.then==='3d')setView('3d');else go('cpu');return}
  if('loadBlank' in d){build={};loadedPreset=null;go('cpu');toast('Started a fresh build');return}
  if(d.recf){recFilter=d.recf;render();return}
  if(d.pickStay){pick(d.pickStay,true);return}
  if(d.hl){if(T){T.legendHl=T.hl===d.hl?null:d.hl;T.hl=T.legendHl;syncLegend()}return}
  if(t.id==='tExplode'){explode=!explode;t.classList.toggle('on',explode);applyExplode(false);return}
  if(t.id==='tRotate'){autoRot=!autoRot;t.classList.toggle('on',autoRot);return}
  if(t.id==='tReset'){if(T){T.orbit.th=0.75;T.orbit.ph=1.15;buildScene()}return}
  if(d.view){if(d.stepTo){view='build';go(d.stepTo);return}if(d.step){go(d.step);return}setView(d.view);return}
  if(d.step){go(d.step);return}
  if(d.sort){sort=d.sort;render();return}
  if(d.pick){pick(d.pick,false);return}
  if(d.clear){delete build[d.clear];render();return}
  if('dismiss' in d){loadedPreset=null;render();return}
  if(d.load){const s=store.get('rf-saved',[])[+d.load];if(s){build={...s.build};loadedPreset=null;go('review');toast(`Loaded “${s.name}”`)}return}
  if(d.del){const arr=store.get('rf-saved',[]);const[r]=arr.splice(+d.del,1);store.set('rf-saved',arr);render();toast(`Deleted “${r.name}”`);return}
  if(t.id==='openSheet'){openSheet();return}
  if(t.id==='closeSheet'){closeSheet();return}
  if(t.id==='save'){const name=($('#bname').value||'').trim()||'My build';const arr=store.get('rf-saved',[]);
    arr.unshift({name,build:{...build},date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})});store.set('rf-saved',arr.slice(0,20));toast(`Saved “${name}” in this browser`);return}
  if(t.id==='copy'){const b=resolve(build);const txt='RigForge build\n'+CATS.map(c=>`${c.label}: ${b[c.key]?b[c.key].name+' — '+money(b[c.key].price):'—'}`).join('\n')+`\nTotal: ${money(total(build))}`;
    const done=()=>toast('Parts list copied');try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done))}catch(err){fallbackCopy(txt,done)}return}
  if(t.id==='cart'){toast(`Added ${Object.keys(build).length} parts to cart (demo)`);return}
});
function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Select and copy the list manually')}ta.remove()}
$('#scrim').addEventListener('click',closeSheet);
$('#dscrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeConv();closeSheet();closeDrawer();if(!$('#chat').hidden&&!chatBusy)closeChat()}});
document.addEventListener('submit',e=>{
  if(e.target.id==='chForm'){e.preventDefault();if(chatBusy){chatCtl?.abort();return}const v=$('#chIn').value;$('#chIn').value='';autoGrow();sendChat(v)}
  if(e.target.id==='fRev'){e.preventDefault();postReview()}
  if(e.target.id==='fCom'){e.preventDefault();postComment()}
});
function autoGrow(){const el=$('#chIn');el.style.height='auto';el.style.height=Math.min(120,el.scrollHeight)+'px'}
$('#chIn').addEventListener('input',autoGrow);
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#chForm').requestSubmit()}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;render();const el=$('#q');el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
  if(e.target.id==='cAmt'){conv.amt=e.target.value;$('#cOut').textContent=fmtIn(conv.to,convert(+conv.amt||0,conv.from,conv.to))}
});
document.addEventListener('change',e=>{
  if(e.target.id==='cur')setCur(e.target.value);
  if(e.target.id==='compat'){compatOnly=e.target.checked;render()}
  if(e.target.id==='brandF'){brandF=e.target.value;render()}
  if(e.target.id==='cFrom'){conv.from=e.target.value;renderConv()}
  if(e.target.id==='cTo'){conv.to=e.target.value;renderConv()}
});

if(!window.claude)document.documentElement.classList.add('no-claude');
render();
initSample();
initData();
</script>
